[package]
name = "gitdif"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.28"
portable-pty = "0.9"
ratatui = "0.29"
syntect = { version = "5", default-features = false, features = ["plist-load", "parsing", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
vt100 = "0.15"

[profile.release]
lto = true
strip = true
